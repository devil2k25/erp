version: '3.9'

services:
  mysql-master:
    image: mysql:8.0
    container_name: erp_mysql_master
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: erp_master
      MYSQL_USER: erp_master_user
      MYSQL_PASSWORD: ${MYSQL_MASTER_PASSWORD}
    volumes:
      - mysql_master_data:/var/lib/mysql
      - ./docker/mysql/master.cnf:/etc/mysql/conf.d/master.cnf
    # Port NOT exposed — accessible only within Docker network
    networks:
      - erp_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: erp_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    # Port NOT exposed — accessible only within Docker network
    networks:
      - erp_net

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    image: erp_backend:latest
    container_name: erp_backend
    restart: unless-stopped
    volumes:
      - ./backend/storage:/var/www/backend/storage
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      MASTER_DB_HOST: mysql-master
      MASTER_DB_PORT: 3306
      MASTER_DB_DATABASE: erp_master
      # Use root for master connection — required for CREATE DATABASE when provisioning tenants
      MASTER_DB_USERNAME: root
      MASTER_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
    depends_on:
      mysql-master:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - erp_net

  queue-worker:
    image: erp_backend:latest
    container_name: erp_queue_worker
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --no-interaction
    volumes:
      - ./backend/storage:/var/www/backend/storage
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      MASTER_DB_HOST: mysql-master
      MASTER_DB_PORT: 3306
      MASTER_DB_DATABASE: erp_master
      MASTER_DB_USERNAME: root
      MASTER_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: redis
      CACHE_STORE: redis
    depends_on:
      - backend
    networks:
      - erp_net

  scheduler:
    image: erp_backend:latest
    container_name: erp_scheduler
    restart: unless-stopped
    command: bash -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - ./backend/storage:/var/www/backend/storage
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      MASTER_DB_HOST: mysql-master
      MASTER_DB_PORT: 3306
      MASTER_DB_DATABASE: erp_master
      MASTER_DB_USERNAME: root
      MASTER_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: redis
      CACHE_STORE: redis
    depends_on:
      - backend
    networks:
      - erp_net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile.prod
      args:
        VITE_API_URL: ${APP_URL}
        VITE_SOCKET_URL: ${APP_URL}
    container_name: erp_frontend
    restart: unless-stopped
    networks:
      - erp_net

  realtime:
    build:
      context: ./realtime
      dockerfile: ../docker/realtime/Dockerfile
    container_name: erp_realtime
    restart: unless-stopped
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LARAVEL_API_URL: http://backend
      FRONTEND_URL: ${APP_URL}
      PORT: 3001
    depends_on:
      - redis
      - backend
    networks:
      - erp_net

  nginx:
    image: nginx:alpine
    container_name: erp_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/backend/public:ro
      - ./backend/storage/app/public:/var/www/backend/public/storage:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
      - realtime
    networks:
      - erp_net

networks:
  erp_net:
    driver: bridge

volumes:
  mysql_master_data:
  redis_data:
  letsencrypt:
