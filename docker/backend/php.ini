upload_max_filesize = 100M
post_max_size       = 100M
max_execution_time  = 300
; Tuned for 1 GB RAM — each PHP-FPM worker uses up to this
memory_limit        = 128M

; OPcache — reduces memory per request and speeds up responses
opcache.enable              = 1
opcache.memory_consumption  = 32
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files   = 4000
opcache.validate_timestamps = 0
opcache.fast_shutdown       = 1

; PHP-FPM pool — ondemand kills idle workers to save RAM
; (picked up by the default www.conf pool via this ini)
