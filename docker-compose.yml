version: '3.9'

services:
  mysql-master:
    image: mysql:8.0
    container_name: erp_mysql_master
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: erp_master
      MYSQL_USER: erp_master_user
      MYSQL_PASSWORD: ${MYSQL_MASTER_PASSWORD:-masterpassword}
    volumes:
      - mysql_master_data:/var/lib/mysql
      - ./docker/mysql/master.cnf:/etc/mysql/conf.d/master.cnf
    ports:
      - "3306:3306"
    networks:
      - erp_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: erp_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - erp_net

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: erp_backend
    volumes:
      - ./backend:/var/www/backend
      - ./docker/backend/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      MASTER_DB_HOST: mysql-master
      MASTER_DB_DATABASE: erp_master
      MASTER_DB_USERNAME: erp_master_user
      MASTER_DB_PASSWORD: ${MYSQL_MASTER_PASSWORD:-masterpassword}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      QUEUE_CONNECTION: redis
      BROADCAST_DRIVER: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
    depends_on:
      mysql-master:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - erp_net

  queue-worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: erp_queue_worker
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./backend:/var/www/backend
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      MASTER_DB_HOST: mysql-master
      MASTER_DB_DATABASE: erp_master
      MASTER_DB_USERNAME: erp_master_user
      MASTER_DB_PASSWORD: ${MYSQL_MASTER_PASSWORD:-masterpassword}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      QUEUE_CONNECTION: redis
      BROADCAST_DRIVER: redis
      CACHE_DRIVER: redis
    depends_on:
      - backend
    networks:
      - erp_net

  scheduler:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: erp_scheduler
    command: bash -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - ./backend:/var/www/backend
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      MASTER_DB_HOST: mysql-master
      MASTER_DB_DATABASE: erp_master
      MASTER_DB_USERNAME: erp_master_user
      MASTER_DB_PASSWORD: ${MYSQL_MASTER_PASSWORD:-masterpassword}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      QUEUE_CONNECTION: redis
      BROADCAST_DRIVER: redis
      CACHE_DRIVER: redis
    depends_on:
      - backend
    networks:
      - erp_net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: erp_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost
      VITE_SOCKET_URL: http://localhost:3001
    networks:
      - erp_net

  realtime:
    build:
      context: ./realtime
      dockerfile: ../docker/realtime/Dockerfile
    container_name: erp_realtime
    volumes:
      - ./realtime:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379
      LARAVEL_API_URL: http://backend
      FRONTEND_URL: http://localhost:5173
      PORT: 3001
    depends_on:
      - redis
      - backend
    networks:
      - erp_net

  nginx:
    image: nginx:alpine
    container_name: erp_nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend/public:/var/www/backend/public
    depends_on:
      - backend
      - frontend
      - realtime
    networks:
      - erp_net

networks:
  erp_net:
    driver: bridge

volumes:
  mysql_master_data:
  redis_data:
